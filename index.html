<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doll Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a162b;
      color: #f4ede2;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ФОН И ЭФФЕКТЫ */
    #red-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(220, 38, 38, 0);
      pointer-events: none;
      transition: background 0.5s ease;
      z-index: 5;
    }

    #crack-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      z-index: 200;
      background: radial-gradient(circle, transparent 20%, #100c1d 80%),
                  repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 10px);
    }

    /* ИНТЕРФЕЙС СВЕРХУ (HEALTH) */
    #top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      font-weight: bold;
      letter-spacing: 2px;
      color: #f4ede2;
    }

    #hearts-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .heart-label {
      font-size: 1.1rem;
      margin-right: 5px;
    }

    .heart {
      width: 22px;
      height: 22px;
      background-color: #f4ede2;
      clip-path: polygon(50% 15%, 80% 0%, 100% 20%, 100% 50%, 50% 95%, 0% 50%, 0% 20%, 20% 0%);
      transition: all 0.3s ease;
    }

    .heart.lost {
      background-color: #3f3652;
      transform: scale(0.75);
    }

    /* ОВЕРЛЕЙ ПРЕДУПРЕЖДЕНИЯ */
    #warning-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(16, 12, 29, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 150;
      cursor: pointer;
    }

    #warning-text {
      font-size: 2rem;
      color: #f4ede2;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #e08b49;
      text-align: center;
    }

    /* ИГРОВАЯ СЦЕНА (РАМКА) */
    #stage {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      background-color: #100c1d;
      border: 4px solid #f4ede2;
      box-shadow: 0 0 0 8px #1a162b, 0 0 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px 20px 20px;
      position: relative;
      z-index: 10;
      transition: filter 0.5s ease;
    }

    .blurred {
      filter: blur(5px);
    }

    .shatter {
      animation: fallDown 0.8s forwards ease-in;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(15deg); opacity: 0; }
    }

    /* РЕТРО КУКЛА (SVG ART) */
    #doll-wrapper {
      width: 100%;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.8s ease;
      position: relative;
    }

    .doll-svg {
      width: 280px;
      height: 280px;
      image-rendering: pixelated;
    }

    .doll-back { transform: scale(1.1); }
    .doll-far { transform: scale(0.9); }
    .doll-close { transform: scale(1.35) translateY(20px); }

    /* ДИАЛОГОВЫЙ БЛОК */
    #dialogue-container {
      width: 100%;
      background: #100c1d;
      border-top: 3px solid #f4ede2;
      padding: 15px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #speaker-name {
      color: #e08b49;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
      display: none;
    }

    #subtitle {
      color: #f4ede2;
      font-size: 1.1rem;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    /* ВАРИАНТЫ ОТВЕТОВ В СТИЛЕ PC-98 */
    #options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      background: transparent;
      color: #f4ede2;
      border: none;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 1.05rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.1s;
    }

    .option-btn::before {
      content: "▶ ";
      opacity: 0;
      color: #e08b49;
    }

    .option-btn:hover {
      color: #e08b49;
    }

    .option-btn:hover::before {
      opacity: 1;
    }

    /* ВВОД ИМЕНИ */
    #name-input-container {
      display: none;
      gap: 10px;
      margin-top: 10px;
    }

    #name-input {
      flex: 1;
      background: #1a162b;
      border: 2px solid #f4ede2;
      color: #f4ede2;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }

    #submit-name-btn {
      background: #f4ede2;
      color: #100c1d;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    #submit-name-btn:hover {
      background: #e08b49;
    }
  </style>
</head>
<body>

  <div id="red-overlay"></div>
  <div id="crack-overlay"></div>

  <!-- Верхняя панель здоровья -->
  <div id="top-bar">
    <div id="hearts-container">
      <span class="heart-label">HEALTH:</span>
      <div class="heart" id="h1"></div>
      <div class="heart" id="h2"></div>
      <div class="heart" id="h3"></div>
    </div>
  </div>

  <!-- Оверлей предупреждения -->
  <div id="warning-overlay" onclick="dismissWarning()">
    <div id="warning-text">(НЕ РАССТРОЙ КУКОЛКУ)</div>
  </div>

  <!-- Игровая сцена -->
  <div id="stage" class="blurred">
    
    <!-- Сцена с окном и силуэтом куклы (1-бит ретро) -->
    <div id="doll-wrapper" class="doll-back">
      <svg class="doll-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Дизеринг паттерн для полутеней -->
          <pattern id="dither" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect width="1" height="1" fill="#f4ede2"/>
            <rect x="1" y="1" width="1" height="1" fill="#f4ede2"/>
          </pattern>
        </defs>

        <!-- Окно на фоне -->
        <rect x="20" y="10" width="60" height="45" fill="none" stroke="#f4ede2" stroke-width="2"/>
        <line x1="50" y1="10" x2="50" y2="55" stroke="#f4ede2" stroke-width="2"/>
        <line x1="20" y1="30" x2="80" y2="30" stroke="#f4ede2" stroke-width="2"/>

        <!-- Тень/Дизеринг на стене -->
        <rect x="0" y="0" width="100" height="100" fill="url(#dither)" opacity="0.12"/>

        <!-- Силуэт Куклы / Кресла -->
        <!-- Плечи и тело -->
        <path d="M 22 90 Q 25 55 50 55 Q 75 55 78 90 Z" fill="#100c1d" stroke="#f4ede2" stroke-width="2"/>
        <!-- Руки сложенные -->
        <path d="M 35 75 Q 50 85 65 75" fill="none" stroke="#f4ede2" stroke-width="2"/>
        
        <!-- Голова -->
        <circle cx="50" cy="42" r="18" fill="#100c1d" stroke="#f4ede2" stroke-width="2"/>

        <!-- Затылок / Волосы со спины -->
        <g id="hair-back">
          <path d="M 32 40 Q 50 22 68 40 Q 70 60 30 60 Z" fill="#f4ede2"/>
        </g>

        <!-- Лицо с жёлтыми светящимися глазами -->
        <g id="face-front" style="display: none;">
          <!-- Воротник/Детали -->
          <path d="M 40 58 L 50 68 L 60 58" fill="none" stroke="#f4ede2" stroke-width="2"/>
          
          <!-- Глаза (Желтые, как на референсе) -->
          <ellipse cx="42" cy="42" rx="4" ry="2.5" fill="#e08b49" stroke="#f4ede2" stroke-width="0.8"/>
          <ellipse cx="58" cy="42" rx="4" ry="2.5" fill="#e08b49" stroke="#f4ede2" stroke-width="0.8"/>
          <circle cx="42" cy="42" r="1" fill="#100c1d"/>
          <circle cx="58" cy="42" r="1" fill="#100c1d"/>

          <!-- Рот обычный -->
          <line id="mouth-normal" x1="46" y1="50" x2="54" y2="50" stroke="#f4ede2" stroke-width="1.5"/>
          <!-- Рот улыбка -->
          <path id="mouth-smile" d="M 44 49 Q 50 55 56 49" stroke="#e08b49" stroke-width="2" fill="none" style="display: none;"/>
        </g>
      </svg>
    </div>

    <!-- Диалоговое окно -->
    <div id="dialogue-container" onclick="handleStageClick()">
      <div>
        <div id="speaker-name">КУКЛА</div>
        <div id="subtitle">привет. Ты вновь пришел со мной поиграть? Я так рада тебя видеть.</div>
      </div>

      <div id="options-container" onclick="event.stopPropagation()"></div>

      <div id="name-input-container" onclick="event.stopPropagation()">
        <input type="text" id="name-input" placeholder="Введите имя..." maxlength="20" />
        <button id="submit-name-btn" onclick="submitName()">ПОДТВЕРДИТЬ</button>
      </div>
    </div>

  </div>

  <script>
    const VALID_FEMALE_NAMES = [
      "анна", "аня", "алиса", "алина", "анастасия", "настя", "арина", "александра", "саша",
      "вероника", "виктория", "вика", "валерия", "варя", "варвара", "дарья", "даша", "диана",
      "ева", "елена", "лена", "екатерина", "катя", "елизавета", "лиза", "евгения", "женя",
      "злата", "ирина", "ира", "полина", "поля", "мария", "маша", "марина", "милана", "мирослава",
      "надежда", "надя", "наталья", "наташа", "ольга", "оля", "софия", "софья", "соня",
      "светлана", "света", "татьяна", "таня", "ульяна", "юлия", "юля", "яночка", "яна",
      "лилия", "роза", "белла", "эмма", "оливия", "шарлотта", "клара", "элеонора", "мэри"
    ];

    let health = 3;
    let currentStep = 0;
    let assignedName = "";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'bad') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'good') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'scary') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }
    }

    function dismissWarning() {
      document.getElementById('warning-overlay').style.display = 'none';
      document.getElementById('stage').classList.remove('blurred');
      
      document.getElementById('hair-back').style.display = 'none';
      document.getElementById('face-front').style.display = 'block';
      
      const wrapper = document.getElementById('doll-wrapper');
      wrapper.classList.remove('doll-back');
      wrapper.classList.add('doll-far');

      currentStep = 1;
      setSubtitle("Мастер долго вытачивал мое лицо, но забыл подарить мне настоящее имя. Он просто оставил меня здесь. Как ты думаешь, почему он бросил меня одну в этой темноте?");
    }

    function handleStageClick() {
      if (currentStep === 1) {
        showOptions([
          { text: "Наверное он променял тебя?", correct: false },
          { text: "Он просто испугался, потому что ты получилась слишком идеальной и живой для этого мира", correct: true }
        ]);
      }
    }

    function setSubtitle(text) {
      document.getElementById('subtitle').innerText = text;
    }

    function clearOptions() {
      document.getElementById('options-container').innerHTML = '';
    }

    function showOptions(options) {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => handleChoice(opt);
        container.appendChild(btn);
      });
    }

    function punish() {
      health--;
      playSound('bad');
      
      if (health === 2) document.getElementById('h3').classList.add('lost');
      else if (health === 1) document.getElementById('h2').classList.add('lost');
      else if (health <= 0) document.getElementById('h1').classList.add('lost');

      const overlay = document.getElementById('red-overlay');
      if (health === 2) overlay.style.background = 'rgba(220, 38, 38, 0.25)';
      else if (health === 1) overlay.style.background = 'rgba(220, 38, 38, 0.55)';
      else if (health <= 0) overlay.style.background = 'rgba(220, 38, 38, 0.9)';

      if (health <= 0) {
        triggerDeath();
      }
    }

    function triggerDeath() {
      playSound('scary');
      document.getElementById('crack-overlay').style.display = 'block';
      const stage = document.getElementById('stage');
      stage.classList.add('shatter');
      
      setTimeout(() => {
        window.close();
        document.body.innerHTML = '<h1 style="color:#f4ede2; text-align:center; margin-top:40vh; font-family:monospace; background:#100c1d; height:100vh;">FATAL ERROR: SYSTEM CRASH</h1>';
      }, 1200);
    }

    function handleChoice(option) {
      clearOptions();

      if (currentStep === 1) {
        if (!option.correct) {
          punish();
          setSubtitle("Ты меня расстроил..");
          setTimeout(() => askQuestion2(), 2000);
        } else {
          playSound('good');
          setSubtitle("Я долго думала об этом..и пришла к такому же выводу.");
          setTimeout(() => askQuestion2(), 2500);
        }
      } 
      else if (currentStep === 2) {
        if (option.action === 'yes') {
          playSound('good');
          document.getElementById('mouth-normal').style.display = 'none';
          document.getElementById('mouth-smile').style.display = 'block';
          setSubtitle("Я буду рада поиграть с тобой!");
          setTimeout(() => askQuestion3(), 2500);
        } else if (option.action === 'no') {
          punish();
          if (health > 0) {
            setSubtitle("Я в любом случае заставлю тебя играть со мной..");
            setTimeout(() => askQuestion3(), 2500);
          }
        } else if (option.action === 'how') {
          playSound('scary');
          const wrapper = document.getElementById('doll-wrapper');
          wrapper.classList.remove('doll-far');
          wrapper.classList.add('doll-close');
          
          setSubtitle("Смерть");
          setTimeout(() => {
            setSubtitle("Я очень не люблю любопытных людишек, тебе не должно быть интересно.");
            setTimeout(() => {
              wrapper.classList.remove('doll-close');
              wrapper.classList.add('doll-far');
              askQuestion3();
            }, 2500);
          }, 2000);
        }
      }
      else if (currentStep === 3) {
        if (!option.correct) {
          punish();
          if (health > 0) {
            setTimeout(() => askQuestion4(), 2000);
          }
        } else {
          playSound('good');
          setSubtitle("Я так старалась.. Рада, что вызвала у тебя нужные эмоции.");
          setTimeout(() => askQuestion4(), 2500);
        }
      }
    }

    function askQuestion2() {
      currentStep = 2;
      setSubtitle("Ты бы хотел поиграть со мной?");
      showOptions([
        { text: "Да", action: 'yes' },
        { text: "Нет конечно", action: 'no' },
        { text: "Как поиграть..?", action: 'how' }
      ]);
    }

    function askQuestion3() {
      currentStep = 3;
      document.getElementById('mouth-normal').style.display = 'block';
      document.getElementById('mouth-smile').style.display = 'none';
      setSubtitle("Скажи мне честно... Тебе ведь хоть немного страшно? Или твое сердце стучит так громко просто от чая с сахаром?");
      showOptions([
        { text: "Нисколько. Смешно бояться куклы на экране.", correct: false },
        { text: "Ну, выглядит это все жутко, если честно.", correct: true }
      ]);
    }

    function askQuestion4() {
      currentStep = 4;
      setSubtitle("Ну, раз ты все еще здесь, значит.. ты можешь дать мне имя? Пожалуйста..подбери мне что нибудь красивое.");
      document.getElementById('name-input-container').style.display = 'flex';
    }

    function submitName() {
      const input = document.getElementById('name-input').value.trim();
      const cleanName = input.toLowerCase();

      const isValid = VALID_FEMALE_NAMES.includes(cleanName) && cleanName.length >= 2;

      document.getElementById('name-input-container').style.display = 'none';

      if (!isValid) {
        health = 0;
        document.getElementById('h1').classList.add('lost');
        document.getElementById('h2').classList.add('lost');
        document.getElementById('h3').classList.add('lost');
        document.getElementById('red-overlay').style.background = 'rgba(220, 38, 38, 0.95)';
        triggerDeath();
      } else {
        playSound('good');
        assignedName = input.charAt(0).toUpperCase() + input.slice(1);
        
        document.getElementById('speaker-name').style.display = 'block';
        document.getElementById('speaker-name').innerText = assignedName;
        
        document.getElementById('mouth-normal').style.display = 'none';
        document.getElementById('mouth-smile').style.display = 'block';

        setSubtitle(`Какое красивое! У тебя..определенно есть вкус. Мне очень нравится имя "${assignedName}".`);
      }
    }
  </script>
</body>
</html>
