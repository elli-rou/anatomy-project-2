<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doll Game</title>
  <style>
    /* Подключение пиксельного шрифта VPCH2 */
    @font-face {
      font-family: 'VPCH2';
      src: url('VPCH2.otf') format('opentype'),
           url('VPCH2.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #1a162b;
      color: #f4ede2;
      font-family: 'VPCH2', 'Courier New', monospace;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #red-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(220, 38, 38, 0);
      pointer-events: none;
      transition: background 0.5s ease;
      z-index: 5;
    }

    #crack-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      z-index: 200;
      background: radial-gradient(circle, transparent 20%, #100c1d 80%),
                  repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 2px, transparent 2px, transparent 10px);
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ ЗДОРОВЬЯ */
    #top-bar {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      font-weight: bold;
      letter-spacing: 2px;
      color: #f4ede2;
    }

    #hearts-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .heart-label {
      font-size: 1.2rem;
      margin-right: 5px;
    }

    .heart {
      width: 22px;
      height: 22px;
      background-color: #f4ede2;
      clip-path: polygon(50% 15%, 80% 0%, 100% 20%, 100% 50%, 50% 95%, 0% 50%, 0% 20%, 20% 0%);
      transition: all 0.3s ease;
    }

    .heart.lost {
      background-color: #3f3652;
      transform: scale(0.75);
    }

    /* ОВЕРЛЕЙ ПРЕДУПРЕЖДЕНИЯ */
    #warning-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(16, 12, 29, 0.95);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 150;
      cursor: pointer;
      padding: 20px;
    }

    #warning-text {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      color: #f4ede2;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #e08b49;
      text-align: center;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; text-shadow: 2px 2px 8px #e08b49; }
    }

    /* ИГРОВАЯ СЦЕНА */
    #stage {
      width: 100%;
      max-width: 680px;
      height: 100vh;
      max-height: 95vh;
      background-color: #100c1d;
      border: 4px solid #f4ede2;
      box-shadow: 0 0 0 8px #1a162b, 0 0 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      padding-top: 50px;
      position: relative;
      z-index: 10;
      transition: filter 0.5s ease;
      overflow-y: auto;
    }

    /* CRT ЭФФЕКТ */
    #stage::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 30;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .blurred {
      filter: blur(5px);
    }

    .shatter {
      animation: fallDown 0.8s forwards ease-in;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(15deg); opacity: 0; }
    }

    /* АНИМАЦИИ КУКЛЫ */
    #doll-wrapper {
      width: 100%;
      height: 30vh;
      max-height: 320px;
      min-height: 160px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      flex-shrink: 1;
    }

    #doll-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      animation: floatBreath 3.5s infinite ease-in-out, subtleJitter 6s infinite;
      transition: filter 0.2s, transform 0.2s;
    }

    /* Плавно покачивается/дышит */
    @keyframes floatBreath {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    /* Редкое микро-подёргивание */
    @keyframes subtleJitter {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-2px, 1px); }
      95% { transform: translate(2px, -1px); }
      97% { transform: translate(-1px, -2px); }
    }

    /* Анимация при ошибке игрока */
    .doll-hurt {
      animation: hurtShake 0.4s ease-in-out !important;
      filter: drop-shadow(0 0 10px #dc2626) brightness(1.2);
    }

    @keyframes hurtShake {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(0.9) rotate(-5deg); }
      40% { transform: scale(1.1) rotate(5deg); }
      60% { transform: scale(0.95) rotate(-3deg); }
      80% { transform: scale(1.05) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* ДИАЛОГОВЫЙ БЛОК */
    #dialogue-container {
      width: 100%;
      background: #100c1d;
      border-top: 3px solid #f4ede2;
      padding: 15px;
      padding-bottom: 25px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 40;
      flex-shrink: 0;
    }

    #speaker-name {
      color: #e08b49;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
      display: none;
    }

    #subtitle {
      color: #f4ede2;
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      line-height: 1.4;
      margin-bottom: 15px;
      min-height: 3.5em;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* КНОПКИ ВАРИАНТОВ */
    #options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      background: transparent;
      color: #f4ede2;
      border: none;
      padding: 8px 10px;
      font-family: 'VPCH2', 'Courier New', monospace;
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      word-wrap: break-word;
      overflow-wrap: break-word;
      word-break: break-word;
      white-space: normal;
      line-height: 1.3;
    }

    .option-btn::before {
      content: "▶ ";
      opacity: 0;
      color: #e08b49;
      transition: opacity 0.15s ease, transform 0.15s ease;
      display: inline-block;
      transform: translateX(-5px);
    }

    .option-btn:hover {
      color: #e08b49;
      transform: translateX(6px);
    }

    .option-btn:hover::before {
      opacity: 1;
      transform: translateX(0);
    }

    #name-input-container {
      display: none;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    #name-input {
      flex: 1;
      min-width: 140px;
      background: #1a162b;
      border: 2px solid #f4ede2;
      color: #f4ede2;
      padding: 8px 12px;
      font-family: 'VPCH2', 'Courier New', monospace;
      font-size: 1.1rem;
      outline: none;
    }

    #submit-name-btn {
      background: #f4ede2;
      color: #100c1d;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'VPCH2', 'Courier New', monospace;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    #submit-name-btn:hover {
      background: #e08b49;
    }

    @media (max-height: 650px) {
      #stage {
        padding-top: 45px;
      }
      #doll-wrapper {
        height: 22vh;
        min-height: 120px;
      }
      #dialogue-container {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>

  <div id="red-overlay"></div>
  <div id="crack-overlay"></div>

  <div id="top-bar">
    <div id="hearts-container">
      <span class="heart-label">HEALTH:</span>
      <div class="heart" id="h1"></div>
      <div class="heart" id="h2"></div>
      <div class="heart" id="h3"></div>
    </div>
  </div>

  <div id="warning-overlay" onclick="dismissWarning()">
    <div id="warning-text">(НЕ РАССТРОЙ КУКОЛКУ)</div>
  </div>

  <div id="stage" class="blurred">
    <div id="doll-wrapper">
      <img id="doll-img" src="doll_back.png" alt="Doll" />
    </div>

    <div id="dialogue-container" onclick="handleStageClick()">
      <div>
        <div id="speaker-name">КУКЛА</div>
        <div id="subtitle"></div>
      </div>

      <div id="options-container" onclick="event.stopPropagation()"></div>

      <div id="name-input-container" onclick="event.stopPropagation()">
        <input type="text" id="name-input" placeholder="Введите имя..." maxlength="20" />
        <button id="submit-name-btn" onclick="submitName()">ПОДТВЕРДИТЬ</button>
      </div>
    </div>
  </div>

  <script>
    const VALID_FEMALE_NAMES = [
      "анна", "аня", "алиса", "алина", "анастасия", "настя", "арина", "александра", "саша",
      "вероника", "виктория", "вика", "валерия", "варя", "варвара", "дарья", "даша", "диана",
      "ева", "елена", "лена", "екатерина", "катя", "елизавета", "лиза", "евгения", "женя",
      "злата", "ирина", "ира", "полина", "поля", "мария", "маша", "марина", "милана", "мирослава",
      "надежда", "надя", "наталья", "наташа", "ольга", "оля", "софия", "софья", "соня",
      "светлана", "света", "татьяна", "таня", "ульяна", "юлия", "юля", "яночка", "яна",
      "лилия", "роза", "белла", "эмма", "оливия", "шарлотта", "клара", "элеонора", "мэри"
    ];

    let health = 3;
    let currentStep = 0;
    let assignedName = "";
    let typingTimer = null;
    let isTyping = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playKeyClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'bad') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else if (type === 'good') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'scary') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }
    }

    function setSubtitle(text, callback = null) {
      if (typingTimer) clearInterval(typingTimer);
      const el = document.getElementById('subtitle');
      el.innerHTML = "";
      let index = 0;
      isTyping = true;

      typingTimer = setInterval(() => {
        if (index < text.length) {
          const char = text.charAt(index);
          if (char === " ") {
            el.innerHTML += "&nbsp;";
          } else {
            el.innerHTML += char;
            playKeyClickSound();
          }
          index++;
        } else {
          clearInterval(typingTimer);
          isTyping = false;
          if (callback) callback();
        }
      }, 40);
    }

    function setDollImage(filename) {
      document.getElementById('doll-img').src = filename;
    }

    function triggerDollHurtAnimation() {
      const img = document.getElementById('doll-img');
      img.classList.remove('doll-hurt');
      void img.offsetWidth; // перезапуск анимации
      img.classList.add('doll-hurt');
      setTimeout(() => img.classList.remove('doll-hurt'), 400);
    }

    function dismissWarning() {
      document.getElementById('warning-overlay').style.display = 'none';
      document.getElementById('stage').classList.remove('blurred');
      setDollImage('doll_far.jpg');
      currentStep = 1;
      setSubtitle("привет. Ты вновь пришел со мной поиграть? Я так рада тебя видеть.");
    }

    function handleStageClick() {
      if (isTyping) return;
      if (currentStep === 1) {
        setSubtitle("Мастер долго вытачивал мое лицо, но забыл подарить мне настоящее имя. Он просто оставил меня здесь. Как ты думаешь, почему он бросил меня одну в этой темноте?", () => {
          showOptions([
            { text: "Наверное он променял тебя?", correct: false },
            { text: "Он просто испугался, потому что ты получилась слишком идеальной и живой для этого мира", correct: true }
          ]);
        });
      }
    }

    function clearOptions() {
      document.getElementById('options-container').innerHTML = '';
    }

    function showOptions(options) {
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => handleChoice(opt);
        container.appendChild(btn);
      });
    }

    function punish() {
      health--;
      playSound('bad');
      triggerDollHurtAnimation();

      if (health === 2) document.getElementById('h3').classList.add('lost');
      else if (health === 1) document.getElementById('h2').classList.add('lost');
      else if (health <= 0) document.getElementById('h1').classList.add('lost');
      
      const overlay = document.getElementById('red-overlay');
      if (health === 2) overlay.style.background = 'rgba(220, 38, 38, 0.25)';
      else if (health === 1) overlay.style.background = 'rgba(220, 38, 38, 0.55)';
      else if (health <= 0) overlay.style.background = 'rgba(220, 38, 38, 0.9)';
      
      if (health <= 0) triggerDeath();
    }

    function triggerDeath() {
      playSound('scary');
      document.getElementById('crack-overlay').style.display = 'block';
      const stage = document.getElementById('stage');
      stage.classList.add('shatter');
      setTimeout(() => {
        window.close();
        document.body.innerHTML = '<h1 style="color:#f4ede2; text-align:center; margin-top:40vh; font-family:VPCH2, monospace; background:#100c1d; height:100vh;">FATAL ERROR: SYSTEM CRASH</h1>';
      }, 1200);
    }

    function handleChoice(option) {
      clearOptions();
      if (currentStep === 1) {
        if (!option.correct) {
          punish();
          setSubtitle("Ты меня расстроил..", () => setTimeout(() => askQuestion2(), 1500));
        } else {
          playSound('good');
          setSubtitle("Я долго думала об этом..и пришла к такому же выводу.", () => setTimeout(() => askQuestion2(), 1800));
        }
      } 
      else if (currentStep === 2) {
        if (option.action === 'yes') {
          playSound('good');
          setSubtitle("Я буду рада поиграть с тобой!", () => setTimeout(() => askQuestion3(), 1800));
        } else if (option.action === 'no') {
          punish();
          if (health > 0) setSubtitle("Я в любом случае заставлю тебя играть со мной..", () => setTimeout(() => askQuestion3(), 1800));
        } else if (option.action === 'how') {
          playSound('scary');
          setDollImage('doll_knife.png');
          triggerDollHurtAnimation();
          setSubtitle("Я очень не люблю любопытных людишек, тебе не должно быть интересно...", () => {
            setTimeout(() => {
              setDollImage('doll_far.jpg');
              askQuestion3();
            }, 2500);
          });
        }
      }
      else if (currentStep === 3) {
        if (!option.correct) {
          punish();
          if (health > 0) setTimeout(() => askQuestion4(), 1500);
        } else {
          playSound('good');
          setSubtitle("Я так старалась.. Рада, что вызвала у тебя нужные эмоции.", () => setTimeout(() => askQuestion4(), 1800));
        }
      }
    }

    function askQuestion2() {
      currentStep = 2;
      setSubtitle("Ты бы хотел поиграть со мной?", () => {
        showOptions([
          { text: "Да", action: 'yes' },
          { text: "Нет конечно", action: 'no' },
          { text: "Как поиграть..?", action: 'how' }
        ]);
      });
    }

    function askQuestion3() {
      currentStep = 3;
      setDollImage('doll_far.jpg');
      setSubtitle("Скажи мне честно... Тебе ведь хоть немного страшно? Или твое сердце стучит так громко просто от чая с сахаром?", () => {
        showOptions([
          { text: "Нисколько. Смешно бояться куклы на экране.", correct: false },
          { text: "Ну, выглядит это все жутко, если честно.", correct: true }
        ]);
      });
    }

    function askQuestion4() {
      currentStep = 4;
      setSubtitle("Ну, раз ты все еще здесь, значит.. ты можешь дать мне имя? Пожалуйста..подбери мне что нибудь красивое.", () => {
        document.getElementById('name-input-container').style.display = 'flex';
      });
    }

    function submitName() {
      const input = document.getElementById('name-input').value.trim();
      const isValid = VALID_FEMALE_NAMES.includes(input.toLowerCase()) && input.length >= 2;
      document.getElementById('name-input-container').style.display = 'none';
      if (!isValid) {
        health = 0;
        document.getElementById('h1').classList.add('lost');
        document.getElementById('h2').classList.add('lost');
        document.getElementById('h3').classList.add('lost');
        document.getElementById('red-overlay').style.background = 'rgba(220, 38, 38, 0.95)';
        triggerDeath();
      } else {
        playSound('good');
        assignedName = input.charAt(0).toUpperCase() + input.slice(1);
        document.getElementById('speaker-name').style.display = 'block';
        document.getElementById('speaker-name').innerText = assignedName;
        setSubtitle(`Какое красивое! У тебя..определенно есть вкус. Мне очень нравится имя "${assignedName}".`);
      }
    }
  </script>
</body>
</html>
